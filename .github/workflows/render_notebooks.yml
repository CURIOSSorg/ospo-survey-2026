name: Render Quarto Notebooks

on:
  push:
    branches: [ main ] 
    paths:
      - '**.qmd'       # Trigger when a .qmd file is modified
      - 'renv.lock'     # Or when dependencies are updated

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Uses Posit Public Package Manager for fast pre-compiled Linux binaries
      
      - name: Restore renv packages
        uses: r-lib/actions/setup-renv@v2 

      - name: Render all Quarto files
        run: quarto render

      - name: Commit and push rendered outputs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || git commit -m "Render Quarto notebooks [skip ci]"
          git push
